# StoopSave — Android cloud build (proper Gradle build)
#
# Builds a signed release APK using the full Gradle Android plugin —
# proper manifest merging, AAR handling, and dependency resolution.
# This replaces the manual aapt2 build script which was dropping
# ML Kit classes and manifest entries.
#
# Signing: uses the release keystore stored as GitHub secrets.
# Required secrets: ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD,
# KEY_ALIAS, KEY_PASSWORD

name: android-build-release

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/stoopsave.keystore

      - name: Build release APK with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          arguments: |
            assembleRelease
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/app/stoopsave.keystore
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }}
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }}
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: StoopSave-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
